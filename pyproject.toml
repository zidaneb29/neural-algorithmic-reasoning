[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-generalization"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["networkx==3.4.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
train = ["torch>=2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
